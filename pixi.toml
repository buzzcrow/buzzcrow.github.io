[workspace]
name = "buzzcrow-blog"
version = "0.1.0"
description = "CROWDB engineering blog"
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64", "osx-64"]

[dependencies]
ruby = "3.3.*"
git = "*"
c-compiler = "*"
cxx-compiler = "*"
make = "*"
pkg-config = "*"
openssl = "*"

[tasks]
bundle-install = { cmd = "bash tools/pixi-tasks/bundle-install.sh" }
build = { cmd = "BUNDLE_PATH=.pixi/bundle JEKYLL_ENV=production bundle exec jekyll build", depends-on = ["bundle-install"] }
serve = { cmd = "BUNDLE_PATH=.pixi/bundle bundle exec jekyll serve", depends-on = ["bundle-install"] }
test = { cmd = "BUNDLE_PATH=.pixi/bundle JEKYLL_ENV=production bundle exec jekyll build", depends-on = ["bundle-install"] }
