<title id="hero-title">Different access models, one CROWDB storage core</title><desc id="hero-desc">S3 and Iceberg connect to shared chunk storage and distributed metadata. Dataset is a planned access model shown with a dashed outline. The stacked planes are a conceptual illustration, not sequential request hops.</desc>
